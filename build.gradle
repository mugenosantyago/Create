dependencies {
    // Registrate MC1.21.8-1.3.0 built locally from tterrag1098/Registrate 1.21.8/dev branch.
    // Uses com.tterrag.registrate package (original package name maintained).
    jarJar(implementation("com.tterrag.registrate:Registrate:MC1.21.8-1.3.0+96c1702"))

    // Flywheel 1.0.7 built locally for MC 1.21.8 (published to Maven local).
    // Use full jar for runtime, api jar for compile.
    jarJar(implementation("dev.engine-room.flywheel:flywheel-neoforge-1.21.8:$flywheel_version"))
    flywheelOriginal("dev.engine-room.flywheel:flywheel-neoforge-1.21.8:$flywheel_version") {
        transitive = false
    }
    // vanillin is runtime-only so no compileOnly stub needed for it

    // Ponder JiJ (unpatched at resolve time; replacePonderInCreateJar swaps nested jar after :jar — avoids
    // Gradle cycles and JPMS duplicate export if we shadowed net.createmod.ponder in main sources).
    ponderOriginal("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}") {
        transitive = false
    }
    jarJar(implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"))

    //compileOnly("mezz.jei:jei-$minecraft_version-common-api:$jei_version")
    //compileOnly("mezz.jei:jei-$minecraft_version-neoforge-api:$jei_version")
    implementation("mezz.jei:jei-$minecraft_version-neoforge:$jei_version")

    // Curios 12.0.0+1.21.8 (CurseForge file 6538253)
    compileOnly("top.theillusivec4.curios:curios-neoforge:$curios_version+$minecraft_version:api")
    runtimeOnly("top.theillusivec4.curios:curios-neoforge:$curios_version+$minecraft_version")

    // Sodium 0.7.2 for NeoForge 1.21.8 (modrinth: mc1.21.8-0.7.2-neoforge)
    compileOnly("maven.modrinth:sodium:mc$minecraft_version-$sodium_version-neoforge")

    // CC: Tweaked disabled - no confirmed MC 1.21.8 NeoForge build yet
    // Re-enable once available: https://modrinth.com/mod/cc-tweaked
    if (cc_tweaked_enable.toBoolean()) {
        compileOnly("cc.tweaked:cc-tweaked-$minecraft_version-core-api:$cc_tweaked_version")
        compileOnly("cc.tweaked:cc-tweaked-$minecraft_version-forge-api:$cc_tweaked_version")
        runtimeOnly("cc.tweaked:cc-tweaked-$minecraft_version-forge:$cc_tweaked_version")
    }

    // Farmer's Delight disabled - no confirmed 1.21.8 version yet
    // Re-enable and set a real version before uncommenting:
    // compileOnly("maven.modrinth:farmers-delight:${farmers_delight_version}")
    // if (farmers_delight_enable.toBoolean()) {
    //     implementation("maven.modrinth:farmers-delight:${farmers_delight_version}")
    // }

    // TODO: FTB Chunks/Teams/Library have no confirmed 1.21.8 builds (only 1.21.1 and 1.21.11).
    // Using 1.21.1 builds for now - will fail at runtime but allows compilation.
    runtimeOnly("dev.architectury:architectury-neoforge:13d.0.8")
    implementation("dev.ftb.mods:ftb-chunks-neoforge:2101.1.1")
    implementation("dev.ftb.mods:ftb-teams-neoforge:2101.1.0")
    implementation("dev.ftb.mods:ftb-library-neoforge:2101.1.3")

    // JourneyMap 6.0.0-beta.52 for NeoForge 1.21.8 (CurseForge file available)
    // TODO: Update journeymap-api to 1.21.8 version when available
    implementation("maven.modrinth:journeymap:1.21.8-6.0.0-beta.52+neoforge")
    implementation("info.journeymap:journeymap-api-neoforge:2.0.0-1.21.1-20260205.200232-15") {
        exclude(group: "curse.maven") // Pulls in old version of journey map which is for forge
    }

    // TODO: Verify Xaero versions for MC 1.21.8
    compileOnly("xaero.lib:xaerolib-neoforge-1.21:1.0.42")
    compileOnly("curse.maven:xaeros-world-map-317780:7401095")
}

tasks.named("compilePonderPatchJava", JavaCompile) {
    // Same mapped deps + AT as main; must not depend on compileJava (jarJar would pull patchPonderJar into compile graph).
    dependsOn tasks.named("createMinecraftArtifacts")
    classpath = sourceSets.main.compileClasspath
}

tasks.named("compileFlywheelPatchJava", JavaCompile) {
    dependsOn tasks.named("createMinecraftArtifacts")
    classpath = sourceSets.main.compileClasspath
}

tasks.register("replacePonderInCreateJar") {
    group = "build"
    description = "Swap META-INF/jarjar/ponder-neoforge-*.jar in the Create jar with patchPonderJar output."
    dependsOn jar
    dependsOn patchPonderJar
    inputs.files(patchPonderJar.outputs.files)
    inputs.file(jar.archiveFile)

    doLast {
        def patchedPonder = patchPonderJar.outputs.files.singleFile
        def mainJarFile = jar.archiveFile.get().asFile
        def tmp = layout.buildDirectory.file("tmp/create-with-patched-ponder.jar").get().asFile
        tmp.parentFile.mkdirs()
        def zip = new ZipFile(mainJarFile)
        try {
            new ZipOutputStream(new FileOutputStream(tmp)).withCloseable { zos ->
                Collections.list(zip.entries()).each { ZipEntry e ->
                    if (e.isDirectory()) return
                    def zosEntry = new ZipEntry(e)
                    zos.putNextEntry(zosEntry)
                    if (e.name.startsWith("META-INF/jarjar/") && e.name.contains("ponder-neoforge") && e.name.endsWith(".jar")) {
                        patchedPonder.withInputStream { stream -> stream.transferTo(zos) }
                    } else {
                        zip.getInputStream(e).transferTo(zos)
                    }
                    zos.closeEntry()
                }
            }
        } finally {
            zip.close()
        }
        tmp.withInputStream { ins ->
            mainJarFile.withOutputStream { outs -> ins.transferTo(outs) }
        }
    }
}

tasks.register("replaceFlywheelInCreateJar") {
    group = "build"
    description = "Swap META-INF/jarjar/flywheel-neoforge-*.jar in the Create jar with patchFlywheelJar output."
    dependsOn replacePonderInCreateJar
    dependsOn patchFlywheelJar
    inputs.files(patchFlywheelJar.outputs.files)
