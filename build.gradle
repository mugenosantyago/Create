buildscript {
    repositories { mavenCentral() }
    dependencies {
        classpath "org.ow2.asm:asm:9.7"
        classpath "org.ow2.asm:asm-commons:9.7"
        classpath "org.ow2.asm:asm-tree:9.7"
    }
}

plugins {
    id("idea")
    id("eclipse")
    id("maven-publish")
    id("net.kyori.blossom") version "2.1.0" // https://github.com/KyoriPowered/blossom
    id("dev.ithundxr.silk") version "1.0.1" // https://github.com/ithundxr/silk
    id("net.neoforged.moddev") version "2.0.107" // https://projects.neoforged.net/neoforged/ModDevGradle
    id("me.modmuss50.mod-publish-plugin") version "0.8.4" // https://github.com/modmuss50/mod-publish-plugin
    id("org.jetbrains.gradle.plugin.idea-ext") version "1.1.8" // https://github.com/JetBrains/gradle-idea-ext-plugin
}

apply(from: "./gradle/java.gradle")
apply(from: "./gradle/property_loader.gradle")

import java.util.Collections
import java.util.zip.ZipEntry
import java.util.zip.ZipFile
import java.util.zip.ZipOutputStream

import org.objectweb.asm.ClassReader
import org.objectweb.asm.ClassVisitor
import org.objectweb.asm.ClassWriter
import org.objectweb.asm.MethodVisitor
import org.objectweb.asm.Opcodes
import org.objectweb.asm.commons.ClassRemapper
import org.objectweb.asm.commons.SimpleRemapper
import org.objectweb.asm.tree.AbstractInsnNode
import org.objectweb.asm.tree.ClassNode
import org.objectweb.asm.tree.InsnList
import org.objectweb.asm.tree.InsnNode
import org.objectweb.asm.tree.JumpInsnNode
import org.objectweb.asm.tree.MethodInsnNode
import org.objectweb.asm.tree.FieldInsnNode
import org.objectweb.asm.tree.FrameNode
import org.objectweb.asm.tree.LabelNode
import org.objectweb.asm.tree.LineNumberNode
import org.objectweb.asm.tree.MethodNode
import org.objectweb.asm.tree.VarInsnNode

boolean dev = System.getenv("RELEASE") == null || System.getenv("RELEASE") == "false"
String buildNumber = System.getenv("BUILD_NUMBER")
String gitHash = calculateGitHash() + (hasUnstaged() ? "-modified" : "")

base {
    archivesName = "create-$minecraft_version"
    group = "com.simibubi.create"
    version = mod_version + (dev && buildNumber != null ? "-${buildNumber}" : "")
}

println("Java: ${System.getProperty("java.version")}, JVM: ${System.getProperty("java.vm.version")} (${System.getProperty("java.vendor")}), Arch: ${System.getProperty("os.arch")}")

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

neoForge {
    version = neo_version

    accessTransformers = files("src/main/resources/META-INF/accesstransformer.cfg")

    if (parchment_version != "none") {
        parchment {
            minecraftVersion = parchment_minecraft_version == "same" ? minecraft_version : parchment_minecraft_version
            mappingsVersion = parchment_version
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        configureEach {
            systemProperty("forge.logging.markers", "REGISTRIES")
            jvmArgument("-XX:+IgnoreUnrecognizedVMOptions")
            jvmArgument("-XX:+AllowEnhancedClassRedefinition")
            //jvmArgument("-XX:-OmitStackTraceInFastThrow") // uncomment when you get exceptions with null messages etc
            //jvmArgument("-XX:+UnlockCommercialFeatures") // uncomment for profiling

            systemProperty("mixin.debug.verbose", "true")
            systemProperty("mixin.debug.export", "true")

            systemProperty("neoforge.enabledGameTestNamespaces", mod_id as String)

            loggingConfigFile = project.file("log4j.xml")
        }

        client {
            client()
        }

        server {
            server()

            gameDirectory = project.file("run/server")

            programArgument("--nogui")
        }

        clientData {
            type = "clientData"

            programArguments.addAll(
                "--mod", mod_id as String,
                "--all",
                "--output", file("src/generated/resources/").getAbsolutePath(),
                "--existing", file("src/main/resources/").getAbsolutePath()
            )
        }

        gameTestServer {
            type = "gameTestServer"
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    // Unpatched Ponder (used only as input to patchPonderJar; JiJ uses the patched file below).
    ponderOriginal
    // Unpatched Flywheel (input to patchFlywheelJar; JiJ uses patched nested jar).
    flywheelOriginal
}

// One class compiled only to patch JiJ Ponder (must not ship in create's module — JPMS duplicate export).
sourceSets {
    ponderPatch {
        java { srcDir "src/ponderPatch/java" }
    }
    flywheelPatch {
        java { srcDir "src/flywheelPatch/java" }
    }
}


tasks.register("patchPonderJar") {
    group = "build"
    description = "Replace broken accessors in Ponder JiJ with MC 1.21.8-compatible classes."
    dependsOn compilePonderPatchJava
    dependsOn configurations.ponderOriginal

    def patchedMixinsJson = layout.projectDirectory.file("src/ponderPatch/resources/ponder-common.mixins.json")

    def outProvider = layout.buildDirectory.file("ponder-patch/ponder-neoforge-${ponder_version}+mc${minecraft_version}.jar")
    outputs.file(outProvider)
    inputs.files({ configurations.ponderOriginal.files })
    inputs.dir({ sourceSets.ponderPatch.java.destinationDirectory })
    inputs.file(patchedMixinsJson)

    doLast {
        def orig = configurations.ponderOriginal.files.find { it.name.startsWith("ponder-neoforge") && it.name.endsWith(".jar") }
        if (orig == null) {
            throw new GradleException("Could not find ponder-neoforge jar in ponderOriginal: ${configurations.ponderOriginal.files.collect { it.name }}")
        }
        def classRoot = sourceSets.ponderPatch.java.destinationDirectory.get().asFile
        def replacements = [
            "net/createmod/ponder/mixin/client/accessor/RenderTypeAccessor.class",
            "net/createmod/ponder/mixin/client/accessor/GameRendererAccessor.class",
            "net/createmod/catnip/net/base/ClientboundPacketPayload.class"
        ]
        // Compiled outside mixin-owned package; upstream still references the old accessor FQN — remapped below.
        def additions = [
            "net/createmod/ponder/mixin/client/ItemRendererMixin.class",
            "net/createmod/ponder/client/ItemRendererAccessor.class",
            "net/createmod/ponder/client/RenderSystemAccessor.class",
            "net/createmod/ponder/mixin/client/NavigatableSimiScreenMixin.class",
            "net/createmod/ponder/mixin/client/ScreenMixin.class"
        ]
        def oldItemRendererAccessorPath = "net/createmod/ponder/mixin/client/accessor/ItemRendererAccessor.class"
        /** Upstream Catnip references this FQN; loading it from {@code net.createmod.ponder.mixin.*} causes IllegalClassLoadError. */
        def oldRenderSystemAccessorPath = "net/createmod/ponder/mixin/client/accessor/RenderSystemAccessor.class"
        def mixinAccessorRemapper = new SimpleRemapper([
                "net/createmod/ponder/mixin/client/accessor/ItemRendererAccessor" : "net/createmod/ponder/client/ItemRendererAccessor",
                "net/createmod/ponder/mixin/client/accessor/RenderSystemAccessor" : "net/createmod/ponder/client/RenderSystemAccessor"
        ])
        def remapMixinAccessorRefs = { byte[] bytes ->
            def reader = new ClassReader(bytes)
            def writer = new ClassWriter(reader, ClassWriter.COMPUTE_MAXS)
            reader.accept(new ClassRemapper(writer, mixinAccessorRemapper), ClassReader.EXPAND_FRAMES)
            writer.toByteArray()
        }
        /** Ponder calls {@code catnip$callGetFov(...)D}; MC 1.21.8 {@code GameRenderer#getFov} returns float. */
        def patchVecHelperCallGetFovReturnType = { byte[] bytes ->
            def reader = new ClassReader(bytes)
            def writer = new ClassWriter(reader, ClassWriter.COMPUTE_MAXS)
            reader.accept(new ClassVisitor(Opcodes.ASM9, writer) {
                @Override
                MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
                    MethodVisitor mv = super.visitMethod(access, name, descriptor, signature, exceptions)
                    return new MethodVisitor(Opcodes.ASM9, mv) {
                        private boolean skipNextD2f = false

                        @Override
                        void visitMethodInsn(int opcode, String owner, String methodName, String methodDesc, boolean isInterface) {
                            if (opcode == Opcodes.INVOKEINTERFACE
                                    && owner == "net/createmod/ponder/mixin/client/accessor/GameRendererAccessor"
                                    && methodName == "catnip\$callGetFov"
                                    && methodDesc == "(Lnet/minecraft/client/Camera;FZ)D") {
                                skipNextD2f = true
                                super.visitMethodInsn(opcode, owner, methodName, "(Lnet/minecraft/client/Camera;FZ)F", isInterface)
                            } else {
                                super.visitMethodInsn(opcode, owner, methodName, methodDesc, isInterface)
                            }
                        }

                        @Override
                        void visitInsn(int opcode) {
                            if (skipNextD2f) {
                                skipNextD2f = false
                                if (opcode == Opcodes.D2F) {
                                    return
                                }
                            }
                            super.visitInsn(opcode)
                        }
                    }
                }
            }, ClassReader.EXPAND_FRAMES)
            writer.toByteArray()
        }
        /** Catnip clientbound packets ship with {@code handle(LocalPlayer)}; dedicated server cannot load that type. */
        def patchCatnipClientboundHandleUsesPlayer = { byte[] bytes ->
            def reader = new ClassReader(bytes)
            def writer = new ClassWriter(reader, ClassWriter.COMPUTE_MAXS)
            def oldHandleDesc = "(Lnet/minecraft/client/player/LocalPlayer;)V"
            def newHandleDesc = "(Lnet/minecraft/world/entity/player/Player;)V"
            reader.accept(new ClassVisitor(Opcodes.ASM9, writer) {
                @Override
                MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
                    def desc = descriptor
                    if (name == "handle" && desc == oldHandleDesc) {
                        desc = newHandleDesc
                    }
                    MethodVisitor mv = super.visitMethod(access, name, desc, signature, exceptions)
                    if (name != "handle" || desc != newHandleDesc) {
                        return mv
                    }
                    return new MethodVisitor(Opcodes.ASM9, mv) {
                        @Override
                        void visitMethodInsn(int opcode, String owner, String methodName, String methodDesc, boolean isInterface) {
                            if (opcode == Opcodes.INVOKEVIRTUAL
                                    && "net/minecraft/client/player/LocalPlayer" == owner
                                    && "displayClientMessage" == methodName) {
                                owner = "net/minecraft/world/entity/player/Player"
                            }
                            super.visitMethodInsn(opcode, owner, methodName, methodDesc, isInterface)
                        }
                    }
                }
            }, ClassReader.EXPAND_FRAMES)
            writer.toByteArray()
        }
        /**
         * After {@link #patchCatnipClientboundHandleUsesPlayer}, {@code handle} still does
         * {@code Minecraft.getInstance().player} with a {@code LocalPlayer}-typed field ref, which forces the
         * dedicated server to resolve {@code LocalPlayer} during class loading. Use the {@code Player} argument instead.
         */
        def removeConfigPacketMinecraftPlayerNullCheck = { byte[] bytes ->
            def handleDesc = "(Lnet/minecraft/world/entity/player/Player;)V"
            def reader = new ClassReader(bytes)
            def cn = new ClassNode()
            reader.accept(cn, ClassReader.EXPAND_FRAMES)
            for (MethodNode mn : cn.methods) {
                if (mn.name != "handle" || mn.desc != handleDesc) {
                    continue
                }
                def insns = mn.instructions
                AbstractInsnNode cur = insns.first
                while (cur instanceof LabelNode || cur instanceof LineNumberNode || cur instanceof FrameNode) {
                    cur = cur.next
                }
                if (cur instanceof VarInsnNode && cur.opcode == Opcodes.ALOAD && cur.var == 1) {
                    continue
                }
                if (!(cur instanceof MethodInsnNode)) {
                    throw new GradleException("ClientboundConfigPacket.handle: expected INVOKESTATIC getInstance, got ${cur}")
                }
                def getInstance = (MethodInsnNode) cur
                if (getInstance.opcode != Opcodes.INVOKESTATIC
                        || getInstance.owner != "net/minecraft/client/Minecraft"
                        || getInstance.name != "getInstance") {
                    throw new GradleException("ClientboundConfigPacket.handle: unexpected start ${getInstance.owner}.${getInstance.name}${getInstance.desc}")
                }
                def getField = getInstance.next
                if (!(getField instanceof FieldInsnNode)
                        || getField.opcode != Opcodes.GETFIELD
                        || getField.owner != "net/minecraft/client/Minecraft"
                        || getField.name != "player") {
                    throw new GradleException("ClientboundConfigPacket.handle: expected GETFIELD Minecraft.player after getInstance, got ${getField}")
                }
                def ifNonNull = getField.next
                if (!(ifNonNull instanceof JumpInsnNode) || ifNonNull.opcode != Opcodes.IFNONNULL) {
                    throw new GradleException("ClientboundConfigPacket.handle: expected IFNONNULL after GETFIELD player, got ${ifNonNull}")
                }
                def earlyReturn = ifNonNull.next
                while (earlyReturn instanceof LabelNode || earlyReturn instanceof LineNumberNode || earlyReturn instanceof FrameNode) {
                    earlyReturn = earlyReturn.next
                }
                if (!(earlyReturn instanceof InsnNode) || earlyReturn.opcode != Opcodes.RETURN) {
                    throw new GradleException("ClientboundConfigPacket.handle: expected RETURN after IFNONNULL, got ${earlyReturn}")
                }
                def targetLabel = ((JumpInsnNode) ifNonNull).label
                insns.remove(getInstance)
                insns.remove(getField)
                insns.remove(ifNonNull)
                insns.remove(earlyReturn)
                def il = new InsnList()
                il.add(new VarInsnNode(Opcodes.ALOAD, 1))
                il.add(new JumpInsnNode(Opcodes.IFNONNULL, targetLabel))
                il.add(new InsnNode(Opcodes.RETURN))
                insns.insertBefore(insns.first, il)
            }
            def writer = new ClassWriter(ClassWriter.COMPUTE_FRAMES)
            cn.accept(writer)
            return writer.toByteArray()
        }
        /** Remap any remaining {@code LocalPlayer} type refs (stack maps, debug, unused pool Utf8) to {@code Player}. */
        def remapCatnipLocalPlayerToPlayer = { byte[] bytes ->
            def remapper = new SimpleRemapper(
                    "net/minecraft/client/player/LocalPlayer",
                    "net/minecraft/world/entity/player/Player")
            def reader = new ClassReader(bytes)
            def writer = new ClassWriter(reader, ClassWriter.COMPUTE_FRAMES)
            reader.accept(new ClassRemapper(writer, remapper), ClassReader.EXPAND_FRAMES)
            return writer.toByteArray()
        }
        (replacements + additions).each { entry ->
            def classFile = new File(classRoot, entry)
            if (!classFile.exists()) {
                throw new GradleException("Missing patched class: ${classFile}")
            }
        }
        def target = outProvider.get().asFile
        target.parentFile.mkdirs()
        def zip = new ZipFile(orig)
        try {
            new ZipOutputStream(new FileOutputStream(target)).withCloseable { zos ->
                Collections.list(zip.entries()).each { ZipEntry e ->
                    if (e.isDirectory()) return
                    if (e.name == oldItemRendererAccessorPath || e.name == oldRenderSystemAccessorPath) {
                        return
                    }
                    def zosEntry = new ZipEntry(e)
                    zos.putNextEntry(zosEntry)
                    if (replacements.contains(e.name)) {
                        def bytes = new File(classRoot, e.name).bytes
                        if (e.name != "net/createmod/catnip/net/base/ClientboundPacketPayload.class") {
                            bytes = remapMixinAccessorRefs(bytes)
                        }
                        zos.write(bytes)
                    } else if (e.name == "ponder-common.mixins.json") {
                        patchedMixinsJson.asFile.withInputStream { stream -> stream.transferTo(zos) }
                    } else if (e.name.endsWith(".class")) {
                        def bytes = zip.getInputStream(e).bytes
                        bytes = remapMixinAccessorRefs(bytes)
                        if (e.name == "net/createmod/catnip/math/VecHelper.class") {
                            bytes = patchVecHelperCallGetFovReturnType(bytes)
                        }
                        if (e.name == "net/createmod/catnip/net/packets/ClientboundConfigPacket.class") {
                            bytes = patchCatnipClientboundHandleUsesPlayer(bytes)
                            bytes = removeConfigPacketMinecraftPlayerNullCheck(bytes)
                            bytes = remapCatnipLocalPlayerToPlayer(bytes)
                        } else if (e.name == "net/createmod/catnip/net/packets/ClientboundSimpleActionPacket.class") {
                            bytes = patchCatnipClientboundHandleUsesPlayer(bytes)
                            bytes = remapCatnipLocalPlayerToPlayer(bytes)
                        }
                        zos.write(bytes)
                    } else {
                        zip.getInputStream(e).transferTo(zos)
                    }
                    zos.closeEntry()
                }
                additions.each { path ->
                    def zosEntry = new ZipEntry(path)
                    zos.putNextEntry(zosEntry)
                    new File(classRoot, path).withInputStream { stream -> stream.transferTo(zos) }
                    zos.closeEntry()
                }
            }
        } finally {
            zip.close()
        }
    }
}

tasks.register("patchFlywheelJar") {
    group = "build"
    description = "Replace Flywheel JiJ mixins for MC 1.21.8 (RenderSystem, GlStateManager, LevelRenderer.renderLevel, LightUpdatedVisualStorage)."
    dependsOn compileFlywheelPatchJava
    dependsOn configurations.flywheelOriginal

    def outProvider = layout.buildDirectory.file("flywheel-patch/flywheel-neoforge-1.21.8-${flywheel_version}.jar")
    outputs.file(outProvider)
    inputs.files({ configurations.flywheelOriginal.files })
    inputs.dir({ sourceSets.flywheelPatch.java.destinationDirectory })

    doLast {
        def orig = configurations.flywheelOriginal.files.find { it.name.startsWith("flywheel-neoforge") && it.name.endsWith(".jar") }
        if (orig == null) {
            throw new GradleException("Could not find flywheel-neoforge jar in flywheelOriginal: ${configurations.flywheelOriginal.files.collect { it.name }}")
        }
        def classRoot = sourceSets.flywheelPatch.java.destinationDirectory.get().asFile
        def flywheelReplacements = [
            "dev/engine_room/flywheel/backend/mixin/RenderSystemMixin.class",
            "dev/engine_room/flywheel/backend/mixin/GlStateManagerMixin.class",
            "dev/engine_room/flywheel/impl/mixin/LevelRendererMixin.class",
            "dev/engine_room/flywheel/impl/visualization/storage/LightUpdatedVisualStorageMixin.class",
            "dev/engine_room/flywheel/lib/model/baked/BakedModelBuffererMixin.class",
            "dev/engine_room/flywheel/lib/model/baked/NeoforgeMeshEmitterMixin.class"
        ]
        flywheelReplacements.each { entry ->
            def f = new File(classRoot, entry)
            if (!f.exists()) {
                throw new GradleException("Missing patched class: ${f}")
            }
        }
        def target = outProvider.get().asFile
        target.parentFile.mkdirs()
        def zip = new ZipFile(orig)
        try {
            new ZipOutputStream(new FileOutputStream(target)).withCloseable { zos ->
                Collections.list(zip.entries()).each { ZipEntry e ->
                    if (e.isDirectory()) return
                    def zosEntry = new ZipEntry(e)
                    zos.putNextEntry(zosEntry)
                    if (flywheelReplacements.contains(e.name)) {
                        new File(classRoot, e.name).withInputStream { stream -> stream.transferTo(zos) }
                    } else {
                        zip.getInputStream(e).transferTo(zos)
                    }
                    zos.closeEntry()
                }
            }
        } finally {
            zip.close()
        }
    }
}

repositories {
    maven { url = "https://maven.tterrag.com" } // tterrag Registrate (1.20.x only on official maven)
    mavenLocal() // Locally built: Flywheel 1.0.8+, Ponder 1.0.0, Registrate MC1.21.8-1.3.0 for MC 1.21.8
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate snapshots (MC1.21.8 not yet published here)
    mavenCentral() // io.github.polari-stars-mc:Registrate-P-STAR:MC1.21.8 stopgap
    maven { url = "https://maven.blamejared.com" } // JEI, Vazkii's Mods
    maven { url = "https://maven.theillusivec4.top/" } // Curios API
    maven { url = "https://maven.squiddev.cc" } // CC: Tweaked
    maven { url = "https://www.cursemaven.com" }
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://maven.ftb.dev/releases" } // FTB Mods
    maven { url = "https://maven.architectury.dev" } // Arch API
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven" }
    // NeoForge config api port, needed by ponder
    maven {
        url = "https://jm.gserv.me/repository/maven-public" // JourneyMap
        content {
            includeGroup "info.journeymap"
            includeGroup "mysticdrew"
        }
    }
    maven { url "https://chocolateminecraft.com/maven" } // Xaero
}

dependencies {
    // Registrate MC1.21.8-1.3.0 built locally from tterrag1098/Registrate 1.21.8/dev branch.
    // Uses com.tterrag.registrate package (original package name maintained).
    jarJar(implementation("com.tterrag.registrate:Registrate:MC1.21.8-1.3.0+96c1702"))

    // Flywheel 1.0.7 built locally for MC 1.21.8 (published to Maven local).
    // Use full jar for runtime, api jar for compile.
    jarJar(implementation("dev.engine-room.flywheel:flywheel-neoforge-1.21.8:$flywheel_version"))
    flywheelOriginal("dev.engine-room.flywheel:flywheel-neoforge-1.21.8:$flywheel_version") {
        transitive = false
    }
    // vanillin is runtime-only so no compileOnly stub needed for it

    // Ponder JiJ (unpatched at resolve time; replacePonderInCreateJar swaps nested jar after :jar — avoids
    // Gradle cycles and JPMS duplicate export if we shadowed net.createmod.ponder in main sources).
    ponderOriginal("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}") {
        transitive = false
    }
    jarJar(implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"))

    //compileOnly("mezz.jei:jei-$minecraft_version-common-api:$jei_version")
    //compileOnly("mezz.jei:jei-$minecraft_version-neoforge-api:$jei_version")
    implementation("mezz.jei:jei-$minecraft_version-neoforge:$jei_version")

    // Curios 12.0.0+1.21.8 (CurseForge file 6538253)
    compileOnly("top.theillusivec4.curios:curios-neoforge:$curios_version+$minecraft_version:api")
    runtimeOnly("top.theillusivec4.curios:curios-neoforge:$curios_version+$minecraft_version")

    // Sodium 0.7.2 for NeoForge 1.21.8 (modrinth: mc1.21.8-0.7.2-neoforge)
    compileOnly("maven.modrinth:sodium:mc$minecraft_version-$sodium_version-neoforge")

    // CC: Tweaked disabled - no confirmed MC 1.21.8 NeoForge build yet
    // Re-enable once available: https://modrinth.com/mod/cc-tweaked
    if (cc_tweaked_enable.toBoolean()) {
        compileOnly("cc.tweaked:cc-tweaked-$minecraft_version-core-api:$cc_tweaked_version")
        compileOnly("cc.tweaked:cc-tweaked-$minecraft_version-forge-api:$cc_tweaked_version")
        runtimeOnly("cc.tweaked:cc-tweaked-$minecraft_version-forge:$cc_tweaked_version")
    }

    // Farmer's Delight disabled - no confirmed 1.21.8 version yet
    // Re-enable and set a real version before uncommenting:
    // compileOnly("maven.modrinth:farmers-delight:${farmers_delight_version}")
    // if (farmers_delight_enable.toBoolean()) {
    //     implementation("maven.modrinth:farmers-delight:${farmers_delight_version}")
    // }

    // TODO: FTB Chunks/Teams/Library have no confirmed 1.21.8 builds (only 1.21.1 and 1.21.11).
    // Using 1.21.1 builds for now - will fail at runtime but allows compilation.
    runtimeOnly("dev.architectury:architectury-neoforge:13d.0.8")
    implementation("dev.ftb.mods:ftb-chunks-neoforge:2101.1.1")
    implementation("dev.ftb.mods:ftb-teams-neoforge:2101.1.0")
    implementation("dev.ftb.mods:ftb-library-neoforge:2101.1.3")

    // JourneyMap 6.0.0-beta.52 for NeoForge 1.21.8 (CurseForge file available)
    // TODO: Update journeymap-api to 1.21.8 version when available
    implementation("maven.modrinth:journeymap:1.21.8-6.0.0-beta.52+neoforge")
    implementation("info.journeymap:journeymap-api-neoforge:2.0.0-1.21.1-20260205.200232-15") {
        exclude(group: "curse.maven") // Pulls in old version of journey map which is for forge
    }

    // TODO: Verify Xaero versions for MC 1.21.8
    compileOnly("xaero.lib:xaerolib-neoforge-1.21:1.0.42")
    compileOnly("curse.maven:xaeros-world-map-317780:7401095")
}

tasks.named("compilePonderPatchJava", JavaCompile) {
    // Same mapped deps + AT as main; must not depend on compileJava (jarJar would pull patchPonderJar into compile graph).
    dependsOn tasks.named("createMinecraftArtifacts")
    classpath = sourceSets.main.compileClasspath
}

// Patched Catnip ClientboundPacketPayload (handle(Player)) must shadow JiJ Ponder during main compilation.
tasks.named("compileJava", JavaCompile).configure {
    dependsOn tasks.named("compilePonderPatchJava")
    classpath = files(sourceSets.ponderPatch.output.classesDirs).plus(classpath)
}

tasks.named("compileFlywheelPatchJava", JavaCompile) {
    dependsOn tasks.named("createMinecraftArtifacts")
    classpath = sourceSets.main.compileClasspath
}

tasks.register("replacePonderInCreateJar") {
    group = "build"
    description = "Swap META-INF/jarjar/ponder-neoforge-*.jar in the Create jar with patchPonderJar output."
    dependsOn jar
    dependsOn patchPonderJar
    inputs.files(patchPonderJar.outputs.files)
    inputs.file(jar.archiveFile)

    doLast {
        def patchedPonder = patchPonderJar.outputs.files.singleFile
        def mainJarFile = jar.archiveFile.get().asFile
        def tmp = layout.buildDirectory.file("tmp/create-with-patched-ponder.jar").get().asFile
        tmp.parentFile.mkdirs()
        def zip = new ZipFile(mainJarFile)
        try {
            new ZipOutputStream(new FileOutputStream(tmp)).withCloseable { zos ->
                Collections.list(zip.entries()).each { ZipEntry e ->
                    if (e.isDirectory()) return
                    def zosEntry = new ZipEntry(e)
                    zos.putNextEntry(zosEntry)
                    if (e.name.startsWith("META-INF/jarjar/") && e.name.contains("ponder-neoforge") && e.name.endsWith(".jar")) {
                        patchedPonder.withInputStream { stream -> stream.transferTo(zos) }
                    } else {
                        zip.getInputStream(e).transferTo(zos)
                    }
                    zos.closeEntry()
                }
            }
        } finally {
            zip.close()
        }
        tmp.withInputStream { ins ->
            mainJarFile.withOutputStream { outs -> ins.transferTo(outs) }
        }
    }
}

